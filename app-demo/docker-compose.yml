# Same file on a laptop, on the demo EC2 instance and in the client's datacenter.
# What changes between modes lives in .env, not here.
#
#   Demo (cloud, EC2 us-east-1):  DATABASE_URL points to Supabase  ->  docker compose up -d --build
#   On-premise:                   self-hosted Postgres             ->  docker compose --profile local-db up -d --build
services:
  # Public entry point: HTTPS + help-desk console (Angular) + console API routes only.
  web:
    build: ./console
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # TLS certificates survive restarts
      - caddy_config:/config
    depends_on:
      - core
    restart: unless-stopped

  core:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # never public; Caddy and the voice agent reach it inside the network
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # only waited on when the local-db profile is active
    restart: unless-stopped

  # Self-hosted Postgres: on-premise mode or offline development.
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-soporte}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"   # localhost only; never published

  # Answers the calls: LiveKit (STT/TTS/VAD) + classifier + core. Outbound only: no ports published.
  voice-agent:
    build:
      context: .
      dockerfile: voice_agent/Dockerfile
    env_file: .env
    environment:
      CORE_URL: http://core:8000          # inside the docker network, whatever .env says
      AUDIO_CACHE_DIR: /cache/audio
    volumes:
      - audio_cache:/cache/audio          # synthesized fixed phrases survive restarts (TTS cost)
    depends_on:
      - core
    restart: unless-stopped

volumes:
  audio_cache:
  pgdata:
  caddy_data:
  caddy_config:
