# Mismo archivo en la notebook, en la VM de la demo y en el datacenter del cliente.
# Lo que cambia entre modos está en .env, no acá.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-soporte}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"   # solo local; no se publica afuera

  core:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/soporte}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  # voice-agent y console se agregan en D1.4 y D4.1.

volumes:
  pgdata:
