# Flujo: la tableta está dañada, no enciende o no está en el puesto.
# Fuente: fuente/incripcion-campo.pdf (Tableta). Textos PENDIENTES de validación por procesos.
id: tableta_no_enciende
descripcion: La tableta no enciende, está dañada o no está en el puesto.
inicio: tableta_en_puesto
escalar: escalar
max_intentos_no_entendi: 2

pasos:
  - id: tableta_en_puesto
    texto: "¿Tiene la tableta con usted en el puesto?"
    si: mover_cable
    no: no_disponible

  - id: mover_cable
    texto: "Mueva el cable en el puerto de carga y mire si aparece el ícono de carga. ¿Aparece?"
    si: resuelto
    no: cable_tipo_c

  - id: cable_tipo_c
    texto: "Conecte la tableta con un cable tipo C. ¿Ahora carga?"
    si: resuelto
    no: otra_toma

  - id: otra_toma
    texto: "Pruebe en otra toma de corriente. ¿Ahora carga?"
    si: resuelto
    no: otro_adaptador

  - id: otro_adaptador
    texto: "Pruebe con otro adaptador de energía. ¿Ahora carga?"
    si: resuelto
    no: escalar

  - id: resuelto
    texto: "Perfecto, la tableta está cargando. Déjela conectada unos minutos antes de usarla. Gracias por llamar."
    fin: true

  - id: no_disponible
    texto: "Entendido. Voy a registrar que no hay tableta en su puesto y aviso a logística para la reposición. Lo van a llamar a este número."
    fin: true
    accion: crear_caso
    destino: logistica
    prioridad: alta

  - id: escalar
    texto: "La tableta no responde. Voy a registrar la novedad del equipo para su reposición; lo van a llamar a este número."
    fin: true
    accion: crear_caso
    destino: logistica
    prioridad: alta
