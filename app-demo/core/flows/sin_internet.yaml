# Flujo: la tableta no tiene conexión a Internet.
# Fuente: fuente/incripcion-campo.pdf (Conectividad). Textos PENDIENTES de validación por procesos.
# Regla: frases cortas, una acción por turno; el operador tiene las manos ocupadas.
id: sin_internet
descripcion: La tableta no tiene conexión a Internet.
inicio: datos_moviles
escalar: escalar
max_intentos_no_entendi: 2

pasos:
  - id: datos_moviles
    texto: "Revise que los datos móviles de la tableta estén activos. ¿Están activos?"
    si: modo_avion
    no: activar_datos

  - id: activar_datos
    texto: "Deslice desde arriba de la pantalla y toque el ícono de datos móviles. Avíseme cuando lo haya activado."
    espera_activa: true
    si: modo_avion
    no: escalar

  - id: modo_avion
    texto: "Ahora revise que el modo avión esté apagado. ¿Ya tiene Internet?"
    si: resuelto
    no: reiniciar

  - id: reiniciar
    texto: "Reinicie la tableta. Me quedo en la línea; avíseme cuando prenda. ¿Ya tiene Internet?"
    espera_activa: true
    si: resuelto
    no: escalar

  - id: resuelto
    texto: "Perfecto, quedó resuelto. Gracias por llamar."
    fin: true

  - id: escalar
    texto: "No pudimos resolverlo por aquí. Voy a dejar un caso para soporte técnico; lo van a llamar a este número."
    fin: true
    accion: crear_caso
    destino: mesa
    prioridad: normal
