# Flujo: primer ingreso a la aplicación (usuario, contraseña y enrolamiento de huella).
# Fuente: fuente/incripcion-campo.pdf (Aplicación). Textos PENDIENTES de validación por procesos.
# La cédula se pide SIEMPRE por teclado (DTMF) y se enmascara antes de guardarla.
id: primer_logueo
descripcion: Primer ingreso a la aplicación (usuario, contraseña y huella).
inicio: pedir_cedula
escalar: escalar
max_intentos_no_entendi: 2

pasos:
  - id: pedir_cedula
    texto: "Marque su número de cédula en el teclado del teléfono y al final la tecla numeral."
    pide_dtmf: true
    si: correo_recibido
    no: escalar

  - id: correo_recibido
    texto: "¿Le llegaron a su correo electrónico el usuario y la contraseña?"
    si: ingresar_usuario
    no: sin_credenciales

  - id: ingresar_usuario
    texto: "En el campo Usuario escriba su número de cédula, y en Contraseña la que le llegó al correo. ¿Pudo entrar?"
    si: enrolar_huella
    no: reintentar_credenciales

  - id: reintentar_credenciales
    texto: "Revise que la cédula no tenga puntos ni espacios y que la contraseña esté exacta, con mayúsculas y minúsculas. Intente otra vez. ¿Pudo entrar?"
    si: enrolar_huella
    no: escalar

  - id: enrolar_huella
    texto: "Ahora el sistema le pide enrolar sus huellas. Ponga los dedos que indica la pantalla. ¿Reconoció la huella?"
    espera_activa: true
    si: resuelto
    no: reintentar_huella

  - id: reintentar_huella
    texto: "Limpie el dedo y el lector, y vuelva a intentarlo con el dedo exacto que muestra la pantalla. ¿La reconoció?"
    espera_activa: true
    si: resuelto
    no: huella_no_reconocida

  - id: resuelto
    texto: "Perfecto, ya puede trabajar. Gracias por llamar."
    fin: true

  - id: sin_credenciales
    texto: "Voy a pedir a la Dirección de Censo que le reenvíen el usuario y la contraseña. Lo van a llamar a este número."
    fin: true
    accion: crear_caso
    destino: direccion_censo
    prioridad: normal

  - id: huella_no_reconocida
    texto: "La huella no se pudo reconocer. Dejo un caso prioritario para la Dirección de Censo; lo van a llamar a este número."
    fin: true
    accion: crear_caso
    destino: direccion_censo
    prioridad: alta

  - id: escalar
    texto: "No pudimos resolverlo por aquí. Voy a dejar un caso para la mesa de ayuda; lo van a llamar a este número."
    fin: true
    accion: crear_caso
    destino: mesa
    prioridad: normal
